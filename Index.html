<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Cocina - Mangiamo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #f5f5f5; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c2c2c; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; color: #ff9800; }
    #estado-conexion { font-size: 0.9rem; color: #4caf50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #1e1e1e; border-left: 6px solid #ff9800; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 1.1rem; }
    .pedido-id { color: #ff9800; }
    .detalle { font-size: 1.15rem; line-height: 1.4; margin-bottom: 16px; white-space: pre-line; background: #262626; padding: 10px; border-radius: 6px; }
    button { background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1b5e20; }
    button:disabled { background: #555; cursor: not-allowed; }
    .vacio { text-align: center; color: #888; font-size: 1.2rem; margin-top: 50px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <h1>🍳 Cocina - Pedidos Pendientes</h1>
    <span id="estado-conexion">Actualizando cada 15s...</span>
  </header>

  <div class="grid" id="contenedor-pedidos">
    <div class="vacio">Cargando pedidos...</div>
  </div>

  <script>
    // Verificá que estos dos paths coincidan con tus Webhooks de n8n
    const URL_GET_PEDIDOS = "https://mangiamo-n8n.ypwfsb.easypanel.host/webhook/cocina";
    const URL_POST_DESPACHAR = "https://mangiamo-n8n.ypwfsb.easypanel.host/webhook/pedido-listo";

    async function cargarPedidos() {
      const estadoEl = document.getElementById("estado-conexion");
      try {
        const res = await fetch(URL_GET_PEDIDOS);
        if (!res.ok) throw new Error("Error HTTP " + res.status);
        const datos = await res.json();
        
        // Filtra solo los que tienen Estado = Pendiente (ajustá los nombres de columna si es necesario)
        const pendientes = Array.isArray(datos) 
          ? datos.filter(p => (p.Estado || p.estado || "").toLowerCase() === "pendiente")
          : [];

        renderizar(pendientes);
        estadoEl.textContent = "🟢 Conectado (" + new Date().toLocaleTimeString() + ")";
        estadoEl.style.color = "#4caf50";
      } catch (err) {
        estadoEl.textContent = "🔴 Error de conexión con n8n";
        estadoEl.style.color = "#f44336";
        console.error(err);
      }
    }

    function renderizar(pedidos) {
      const contenedor = document.getElementById("contenedor-pedidos");
      if (pedidos.length === 0) {
        contenedor.innerHTML = '<div class="vacio">✅ No hay pedidos pendientes en cocina</div>';
        return;
      }

      contenedor.innerHTML = pedidos.map(p => {
        const id = p.ID || p.id || p.row_number || "";
        const cliente = p.Cliente || p.cliente || "Sin nombre";
        const detalle = p.Pedido || p.pedido || p.Detalle || "Sin detalle";

        return `
          <div class="card" id="card-${id}">
            <div>
              <div class="card-header">
                <span class="pedido-id">#${id}</span>
                <span>${cliente}</span>
              </div>
              <div class="detalle">${detalle}</div>
            </div>
            <button onclick="despacharPedido('${id}', this)">✔ Despachar Pedido</button>
          </div>
        `;
      }).join("");
    }

    async function despacharPedido(id, boton) {
      boton.disabled = true;
      boton.textContent = "Despachando...";
      try {
        const res = await fetch(URL_POST_DESPACHAR, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ID: id, Estado: "Completado" })
        });
        if (!res.ok) throw new Error("Error al actualizar");
        
        const tarjeta = document.getElementById("card-" + id);
        if (tarjeta) tarjeta.remove();
        cargarPedidos();
      } catch (err) {
        alert("No se pudo marcar como despachado. Revisá el flujo POST en n8n.");
        boton.disabled = false;
        boton.textContent = "✔ Despachar Pedido";
      }
    }

    cargarPedidos();
    setInterval(cargarPedidos, 15000);
  </script>
</body>
</html>
